# Render Blueprint — New > Blueprint > เลือก repo นี้
# (ฐานข้อมูลใช้ Neon / Supabase ภายนอก แล้วกรอกค่า DATABASE_* ใน dashboard)
services:
  - type: web
    name: forbidden-words-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
