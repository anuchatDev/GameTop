# Render Blueprint — New > Blueprint > เลือก repo นี้
# (ฐานข้อมูลใช้ Neon / Supabase ภายนอก แล้วกรอกค่า DATABASE_* ใน dashboard)
services:
  - type: web
    name: forbidden-words-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      # URL หน้าเว็บบน Netlify — ใช้ทำลิงก์ในอีเมลรีเซ็ตรหัสผ่าน
      - key: PUBLIC_URL
        sync: false
      # ลืมรหัสผ่าน (Brevo) — ไม่ตั้ง = ซ่อนปุ่มลืมรหัสผ่าน
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # ล็อกอินด้วย Google / LINE — ไม่ตั้ง = ซ่อนปุ่ม
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
