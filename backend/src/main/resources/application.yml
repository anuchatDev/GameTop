server:
  port: ${PORT:8080}

spring:
  datasource:
    # dev: H2 เก็บเป็นไฟล์ใน ./data — prod ตั้งค่าผ่าน env (ดู application-prod.yml)
    url: jdbc:h2:file:./data/forbidden-words;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789}
    expiry-hours: 72
  # origin ของหน้าเว็บที่อนุญาตให้เรียก API คั่นด้วย comma
  cors-origins: ${CORS_ORIGINS:*}
  # ชื่อผู้ใช้ที่ได้สิทธิ์ Admin อัตโนมัติ คั่นด้วย comma (ระบบจะให้สิทธิ์ตอน start และตอนสมัคร)
  admin-usernames: ${ADMIN_USERNAMES:}

game:
  # ค่าเริ่มต้นของห้องใหม่ — Host เปลี่ยนได้ในหน้ารอผู้เล่น
  # เวลาต่อรอบ (วินาที) — ตามกติกา 5 นาที
  round-seconds: 300
  # จำนวนรอบต่อเกม — 0 = เล่นไปเรื่อยๆ ไม่จำกัด
  default-rounds: 3
  min-players: 2
  # 0 = ไม่จำกัดจำนวนผู้เล่น (จำกัดจริงโดยจำนวนคำที่เปิดใช้งานในคลัง)
  max-players: 0
  # คะแนนพิเศษต่อการหลอกให้คนอื่นพูดคำต้องห้ามได้ 1 ครั้ง
  kill-score: 1.0
  # อยู่รอดจนหมดเวลา
  survive-score: 0.5
  # อยู่รอดจนหมดเวลา + ทายคำบนหัวตัวเองถูก
  survive-correct-score: 1.0
  # ลบห้องที่ไม่มีความเคลื่อนไหวเกินเวลานี้ (ชั่วโมง)
  room-idle-hours: 6
